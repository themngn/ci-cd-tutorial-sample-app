# Taken from: https://docs.github.com/en/free-pro-team@latest/actions/guides/building-and-testing-python
# and: https://docs.github.com/en/free-pro-team@latest/actions/guides/publishing-docker-images
# and adapted. More info on workflow syntax: https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
name: Lint the code, run tests, build and push Docker image

on:
  push:
    # Match all branches *without* a / in the name.
    # This will exclude "sub" branches, such as "feature branches",
    # named something like: "feature/my-feature". Those branches will
    # likely contain "work in progress" code, so we will run the tests
    # on the local machine and avoid using up GitHub Actions credits
    # (if applicable, such as in `private` repositories).
    # Filter syntax info: https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
    branches:
      - '*'
  pull_request:
    # Since pull requests come from "third parties", we will automatically
    # test everything coming from the outside world, for good measure.
    # The `branches` tag could also be omitted, yielding the same effect here.
    branches:
      - '**'
  release:
    types: [published, edited]

jobs:
  # Run code tests before building the image, to ensure it is good to go
  build:
    name: Run code tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12'] # Using a list so it's extensible for future use

    steps:
    - uses: actions/checkout@v4
    - name: Setting up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint the code with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with unittest
      run: |
        python -m unittest discover

  # Make sure the Docker image starts and serves requests before it can be released
  smoke_test:
    name: Smoke-test Docker image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ci-cd-tutorial-sample-app:${{ github.sha }}
      REPORT: smoke-test-report.txt

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build -t "$IMAGE" .

    - name: Run smoke test
      run: |
        set -euo pipefail
        exec > >(tee "$REPORT") 2>&1
        echo "Image: $IMAGE"
        docker run -d --name smoke-test -p 8000:8000 "$IMAGE"

        for i in $(seq 1 30); do
          curl -fs -o /dev/null http://localhost:8000/ && break
          if [ "$i" -eq 30 ]; then
            echo "::error::Container did not respond on port 8000 within 30s"
            exit 1
          fi
          sleep 1
        done
        echo "Container is up after ${i}s"

        check() {
          local path=$1 expected_code=$2 jq_filter=$3 code
          code=$(curl -s -o body.json -w '%{http_code}' "http://localhost:8000$path")
          echo "GET $path -> $code $(cat body.json)"
          if [ "$code" != "$expected_code" ] || ! jq -e "$jq_filter" body.json > /dev/null; then
            echo "::error::GET $path: expected HTTP $expected_code matching '$jq_filter'"
            exit 1
          fi
        }

        check / 200 '.status == "ok"'
        check /menu 404 'has("error")'
        docker exec smoke-test python seed.py
        check /menu 200 'has("today_special")'
        echo "Smoke test PASSED"

    - name: Show container logs and clean up
      if: always()
      run: |
        docker logs smoke-test || true
        docker rm -f smoke-test || true

    - name: Upload smoke test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-report
        path: ${{ env.REPORT }}
        if-no-files-found: error

  # Build and push the Docker image
  push_to_registry:
    name: Build and push Docker image to Docker Hub
    # ...but only when a `release` is `published`
    if: github.event_name == 'release' # && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [build, smoke_test]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        # if: ${{ github.ref == 'ref/head/master' }} # Info: https://docs.github.com/en/free-pro-team@latest/actions/reference/context-and-expression-syntax-for-github-actions#about-contexts-and-expressions

      - name: Log in to the Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Same tagging scheme as the old `docker/build-push-action@v1`
      # `tag_with_ref` + `tag_with_sha` + `latest` options
      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5 # Info: https://github.com/docker/metadata-action#tags-input
        with:
          images: ${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image to the Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
